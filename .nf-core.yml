repository_type: pipeline

nf_core_version: 4.0.2

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-viral_metagenomics_lite_ont_logo_light.png
    - docs/images/nf-core-viral_metagenomics_lite_ont_logo_light.png
    - docs/images/nf-core-viral_metagenomics_lite_ont_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/workflows/branch.yml
    - .github/workflows/linting_comment.yml
    - .github/workflows/linting.yml
    - .github/.dockstore.yml
    - .github/PULL_REQUEST_TEMPLATE.md
  nextflow_config: false
  multiqc_config:
    - report_comment
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-viral_metagenomics_lite_ont_logo_light.png
    - docs/images/nf-core-viral_metagenomics_lite_ont_logo_light.png
    - docs/images/nf-core-viral_metagenomics_lite_ont_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/.dockstore.yml
    - docs/CONTRIBUTING.md
    - CHANGELOG.md
    - conf/test.config
    - conf/test_full.config
    - .github/workflows/nf-test.yml
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - .github/workflows/branch.yml
    - .github/workflows/nf-test.yml
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - .github/workflows/linting_comment.yml
    - .github/workflows/linting.yml
  readme:
    - nextflow_badge
    - nextflow_badge
    - nfcore_template_badge

template:
  org: mattarnoldbio
  name: viral_metagenomics_lite_ONT
  description: reimplementation of viral_metagenomics lite for ONT data
  author: Matt Arnold
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - github
    - github_badges
    - changelog
    - ci
    - test_config
    - gpu
  is_nfcore: false
